<header class="topbar" id="topbar">
  <div class="shell topbar__inner">
    <a class="brand" href="__BASE__/" aria-label="RL Nexus Startseite">
      <span class="brand__mark"><img src="__BASE__/assets/images/rl-nexus-n-96.png" alt="" width="38" height="38" decoding="async"></span>
      <span>
        <span class="brand__name">RL <em>Nexus</em></span>
        <span class="brand__sub">Esports Management Bot</span>
      </span>
    </a>

    <div class="topbar__end">
      <!-- Ton, Einstellungen und Abmelden stecken im Nutzermenue - das haengt
           app.ts unter diesen Knopf. -->
      <div class="userbox" id="userbox">
        <button class="profile" id="profile" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="userMenu">
          <span class="avatar" id="avatar" aria-hidden="true"></span>
          <span class="profile__text">
            <span class="profile__name" id="profileName"></span>
            <span class="profile__meta" id="profileGroup"></span>
          </span>
          <svg class="profile__chev" aria-hidden="true"><use href="#i-chevron"/></svg>
        </button>
      </div>
    </div>
  </div>
</header>

<main class="shell" style="padding-top:36px">
  <a class="backlink" href="__BASE__/"><svg><use href="#i-arrow"/></svg>Zurück zur Serverauswahl</a>

  <div id="adminPanel" hidden>
    <div class="adminhead">
      <div>
        <h1>Administration</h1>
        <p>Gruppen vergeben und sehen, was der Bot gerade macht.</p>
      </div>
      <span class="gbadge" id="adminMe"></span>
    </div>

    <div class="tiles" id="adminTiles"></div>

    <section class="factbox">
      <h2>Gruppen vergeben</h2>
      <form class="grant" id="grantForm">
        <label class="grant__field">
          <span>Discord-ID</span>
          <input class="text" type="text" id="grantId" placeholder="123456789012345678" inputmode="numeric"
                 autocomplete="off" spellcheck="false" required pattern="\d{17,20}">
        </label>
        <label class="grant__field">
          <span>Gruppe</span>
          <select class="pick" id="grantGroup"></select>
        </label>
        <label class="grant__field grant__field--wide">
          <span>Notiz <i>optional</i></span>
          <input class="text" type="text" id="grantNote" placeholder="Wofür?" autocomplete="off" maxlength="190">
        </label>
        <button class="btn btn--primary" type="submit" id="grantSubmit">Zuweisen</button>
      </form>
      <p class="hintline" id="grantHint">Developer stehen in DEV_USER_IDs in der .env und lassen sich hier nicht ändern.</p>
    </section>

    <section class="factbox">
      <h2>Vergebene Gruppen <span class="gridhead__count" id="entryCount">0</span></h2>
      <div class="people" id="entryList"></div>
    </section>
  </div>

  <div class="empty" id="empty">
    <span class="empty__mark"><svg id="emptyIcon"><use href="#i-shield"/></svg></span>
    <h2 id="emptyTitle">Wird geladen</h2>
    <p id="emptyText">Einen Moment noch.</p>
  </div>
</main>

<div class="toasts" id="toasts"></div>

<script type="module" src="__BASE__/assets/app.js"></script>
</body>
</html>
