<header class="topbar" id="topbar">
  <div class="shell topbar__inner">
    <a class="brand" href="__BASE__/" aria-label="RL Nexus Startseite">
      <span class="brand__mark"><img src="__BASE__/assets/images/rl-nexus-n-96.png" alt="" width="38" height="38" decoding="async"></span>
      <span>
        <span class="brand__name">RL <em>Nexus</em></span>
        <span class="brand__sub">Esports Management Bot</span>
      </span>
    </a>

    <div class="topbar__end">
      <!-- Ton, Einstellungen und Abmelden stecken im Nutzermenue - das haengt
           app.ts unter diesen Knopf. -->
      <div class="userbox" id="userbox">
        <button class="profile" id="profile" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="userMenu">
          <span class="avatar" id="avatar" aria-hidden="true"></span>
          <span class="profile__text">
            <span class="profile__name" id="profileName"></span>
            <span class="profile__meta" id="profileGroup"></span>
          </span>
          <svg class="profile__chev" aria-hidden="true"><use href="#i-chevron"/></svg>
        </button>
      </div>
    </div>
  </div>
</header>

<main class="shell" style="padding-top:36px">
  <a class="backlink" href="__BASE__/"><svg><use href="#i-arrow"/></svg>Zurück zur Serverauswahl</a>

  <div id="trackPanel" hidden>
    <div class="playerhead">
      <span class="avatar avatar--big" id="playerAvatar" aria-hidden="true"></span>
      <div class="playerhead__text">
        <h1 id="playerName"></h1>
        <div class="playerhead__meta" id="playerMeta"></div>
      </div>
      <!-- Wann der naechste Abruf faellig ist. Die Werte kommen aus dem
           Zwischenspeicher, sonst loeste jeder Seitenaufruf einen Abruf aus -
           der Zaehler macht sichtbar, warum eine Zahl gerade stehenbleibt. -->
      <div class="freshness" id="freshness" hidden>
        <span class="freshness__dot" id="freshDot" aria-hidden="true"></span>
        <span class="freshness__text">
          <b id="freshTimer">–</b>
          <i id="freshLabel">bis zur Aktualisierung</i>
        </span>
      </div>
      <button class="btn btn--ghost" type="button" id="trackReload" aria-label="Jetzt neu laden" title="Jetzt neu laden">
        <svg><use href="#i-refresh"/></svg>
      </button>
    </div>

    <!-- Karriere links, Season-Reward und die drei Raenge in der Mitte, Club
         rechts. Die Mitte ist ein eigener Block, damit die beiden Seitenspalten
         am Reward vorbei nach oben durchlaufen.

         Flex und kein Raster mit festen Spalten: fehlt Karriere oder Club, soll
         die Luecke verschwinden statt leer stehenzubleiben. -->
    <div class="trackmain">
      <section class="factbox factbox--side" id="statsBox" hidden>
        <h2>Karriere</h2>
        <div class="statgrid" id="statGrid"></div>
        <!-- Zwei Quoten aus den Werten darueber - Tracking.ts rates(). -->
        <div class="rates" id="statRates"></div>
      </section>

      <div class="trackmid">
        <!-- Der Season-Reward steht ueber den Raengen: er gilt fuer die ganze
             Saison, die drei Playlists sind nur der Weg dorthin. -->
        <section class="rewardstrip" id="seasonBox" hidden>
          <div class="reward" id="reward"></div>
        </section>

        <div class="rankgrid" id="rankGrid"></div>
      </div>

      <section class="factbox factbox--side" id="clubBox" hidden>
        <h2>Club</h2>
        <div class="club" id="club"></div>
      </section>
    </div>

    <p class="hintline" id="trackFoot"></p>
  </div>

  <div class="empty" id="empty">
    <span class="empty__mark"><svg id="emptyIcon"><use href="#i-stats"/></svg></span>
    <h2 id="emptyTitle">Wird geladen</h2>
    <p id="emptyText">Einen Moment noch.</p>
  </div>
</main>

<div class="toasts" id="toasts"></div>

<script type="module" src="__BASE__/assets/app.js"></script>
</body>
</html>
